<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Vault</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

:root {
  --primary-color: #6366f1;
  --primary-hover: #4f46e5;
  --bg-color: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.7);
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --border-color: rgba(255, 255, 255, 0.1);
  --error-color: #ef4444;
  --success-color: #10b981;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-color);
  background-image: 
    radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
    radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
    radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
  background-attachment: fixed;
  color: var(--text-primary);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 400px;
  padding: 2rem;
  transition: max-width 0.5s ease;
}

.container.wide {
  max-width: 800px;
}

.card {
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
  border-radius: 1.5rem;
  padding: 2.5rem;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}

.header {
  text-align: center;
  margin-bottom: 2rem;
}

.header h1 {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  background: linear-gradient(to right, #818cf8, #c084fc);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header p {
  color: var(--text-secondary);
  font-size: 0.875rem;
}

.tabs {
  display: flex;
  margin-bottom: 2rem;
  background: rgba(15, 23, 42, 0.5);
  border-radius: 0.75rem;
  padding: 0.25rem;
}

.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 0.75rem;
  font-size: 0.875rem;
  font-weight: 500;
  border-radius: 0.5rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.tab-btn.active {
  background: var(--primary-color);
  color: white;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  font-size: 0.875rem;
  font-weight: 500;
  margin-bottom: 0.5rem;
  color: var(--text-secondary);
}

.form-group input {
  width: 100%;
  padding: 0.75rem 1rem;
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  color: white;
  font-size: 1rem;
  transition: all 0.3s ease;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary-color);
  box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
}

.btn-submit {
  width: 100%;
  padding: 0.875rem;
  background: var(--primary-color);
  color: white;
  border: none;
  border-radius: 0.5rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-submit:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

.btn-submit:active {
  transform: translateY(0);
}

.message {
  margin-top: 1rem;
  padding: 0.75rem;
  border-radius: 0.5rem;
  font-size: 0.875rem;
  text-align: center;
  display: none;
}

.message.error {
  display: block;
  background: rgba(239, 68, 68, 0.1);
  color: var(--error-color);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.message.success {
  display: block;
  background: rgba(16, 185, 129, 0.1);
  color: var(--success-color);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

/* Hidden elements */
.hidden {
  display: none;
}

/* Dashboard styles (shown after login) */
#dashboard {
  text-align: center;
}

.btn-logout {
  margin-top: 1.5rem;
  padding: 0.5rem 1rem;
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-logout:hover {
  background: rgba(255, 255, 255, 0.05);
  color: white;
}

.add-secret-group {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 2rem;
}

.add-secret-group input {
  flex: 1;
  margin-bottom: 0;
}

.add-secret-group button {
  width: auto;
  white-space: nowrap;
}

#secrets-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
  max-height: 300px;
  overflow-y: auto;
  text-align: left;
}

.secret-item {
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  padding: 1rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.secret-content {
  color: var(--text-primary);
  font-size: 0.875rem;
  word-break: break-all;
  margin-right: 1rem;
}

.btn-delete {
  background: rgba(239, 68, 68, 0.2);
  color: var(--error-color);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 0.25rem;
  padding: 0.25rem 0.5rem;
  cursor: pointer;
  transition: all 0.2s ease;
}

.btn-delete:hover {
  background: var(--error-color);
  color: white;
}

.btn-download {
  display: inline-block;
  background: rgba(16, 185, 129, 0.2);
  color: var(--success-color);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 0.25rem;
  padding: 0.5rem 1rem;
  text-decoration: none;
  font-size: 0.875rem;
  font-weight: 500;
  transition: all 0.2s ease;
  margin-top: 0.5rem;
}

.btn-download:hover {
  background: var(--success-color);
  color: white;
}

.secret-content img {
  max-width: 100%;
  border-radius: 0.25rem;
  margin-top: 0.5rem;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.secret-content img:hover {
  transform: scale(1.02);
}

/* Custom File Upload Styling */
.file-upload-wrapper {
  flex: 1;
  position: relative;
}

.file-upload-wrapper input[type="file"] {
  display: none;
}

.custom-file-upload {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 0.75rem 1rem;
  background: rgba(15, 23, 42, 0.5);
  border: 1px solid var(--border-color);
  border-radius: 0.5rem;
  color: var(--text-secondary);
  font-size: 0.875rem;
  cursor: pointer;
  transition: all 0.3s ease;
  height: 100%;
}

.custom-file-upload:hover {
  border-color: var(--primary-color);
  color: white;
}

#file-name-display {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

/* Image Modal */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  z-index: 1000;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 1;
  transition: opacity 0.3s ease;
}

.modal.hidden {
  opacity: 0;
  pointer-events: none;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 0.5rem;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
}
</style>
</head>
<body>
  <div class="container">
    <div class="card" id="auth-card">
      <div class="header">
        <h1>Secure Vault</h1>
        <p>Access your encrypted storage</p>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <div id="login-form">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••">
        </div>
        <button class="btn-submit" id="btn-login" onclick="login()">Sign In</button>
      </div>

      <div id="register-form" class="hidden">
        <div class="form-group">
          <label for="register-email">Email Address</label>
          <input type="email" id="register-email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" placeholder="••••••••">
        </div>
        <button class="btn-submit" id="btn-register" onclick="register()">Create Account</button>
      </div>

      <div id="auth-message" class="message"></div>
    </div>

    <div class="card hidden" id="dashboard">
      <div class="header">
        <h1>Your Secure Vault</h1>
        <p>End-to-End Encrypted Secrets</p>
      </div>
      
      <div class="form-group add-secret-group">
        <input type="text" id="new-secret" placeholder="Enter a new secret to store...">
        <button class="btn-submit" id="btn-save-secret" onclick="saveSecret()">Save Text</button>
      </div>

      <div class="form-group add-secret-group">
        <div class="file-upload-wrapper">
          <label for="new-file" class="custom-file-upload">
            <span id="file-name-display">Choose Image or PDF...</span>
          </label>
          <input type="file" id="new-file" accept="image/*,application/pdf" onchange="updateFileName(this)">
        </div>
        <button class="btn-submit" id="btn-save-file" onclick="saveFile()">Upload File</button>
      </div>

      <div id="secrets-list">
        <!-- Secrets will load here -->
      </div>

      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <!-- Fullscreen Image Modal -->
  <div id="image-modal" class="modal hidden" onclick="closeModal()">
    <img id="modal-image" src="" alt="Full Screen Preview">
  </div>

  <script src="crypto.js"></script>
  <script src="api.js"></script>
</body>
</html>
